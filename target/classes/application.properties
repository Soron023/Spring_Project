# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5435/spring_boot_app
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=mySecretKey123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890
jwt.expiration=86400000

# Server
server.port=8080

# Logging
logging.level.com.example.springbootapp=DEBUG
logging.level.org.springframework.security=DEBUG

# Audit Configuration
audit.retention.days=90
audit.enabled=true
audit.log-levels=INFO,WARNING,ERROR,SECURITY,CRITICAL 

spring.flyway.baseline-on-migrate=true 